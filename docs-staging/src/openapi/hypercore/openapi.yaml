openapi: 3.1.0
info:
  title: Alchemy HyperCore REST API - Draft Contract
  version: 0.1.0-draft
  description: |
    Candidate OpenAPI representation for HyperCore read and historical methods. This is a staging-only contract for engineering review and does not describe a production endpoint.
servers:
  - url: https://<HYPERCORE_HTTP_URL>
    description: Proposed HyperCore API endpoint
tags:
  - name: Native-compatible reads
  - name: Enriched account data
paths:
  /info:
    post:
      tags: [Native-compatible reads]
      operationId: hypercoreInfo
      summary: Execute a native-compatible HyperCore read
      description: |
        Proposed shared POST endpoint using the required type discriminator. This operation represents userFills, userFillsByTime, historicalOrders, userFunding, userNonFundingLedgerUpdates, delegations, delegatorHistory, clearinghouseState, spotClearinghouseState, and frontendOpenOrders.
      x-alchemy-review-status: engineering-review-required
      x-alchemy-reference-operations: [userFills, userFillsByTime, historicalOrders, userFunding, userNonFundingLedgerUpdates, delegations, delegatorHistory, clearinghouseState, spotClearinghouseState, frontendOpenOrders]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InfoRequest'
            examples:
              userFills:
                value: { type: userFills, user: '0x1111111111111111111111111111111111111111' }
              userFillsByTime:
                value: { type: userFillsByTime, user: '0x1111111111111111111111111111111111111111', startTime: 1780000000000, endTime: 1780086400000 }
      responses:
        '200':
          description: Successful response. Shape is selected by the requested type.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InfoResponse'
              examples:
                fills:
                  $ref: '#/components/examples/UserFillsResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /v1/hypercore/portfolio-state:
    post:
      tags: [Enriched account data]
      operationId: portfolioState
      summary: Get normalized portfolio state
      description: Proposed purpose-built composite for perpetual state, spot state, and margin data.
      x-alchemy-review-status: engineering-review-required
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserRequest' }
            examples:
              default: { value: { user: '0x1111111111111111111111111111111111111111', include: [positions, balances, margin] } }
      responses:
        '200':
          description: Proposed normalized portfolio state.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PortfolioState' }
              examples: { default: { $ref: '#/components/examples/PortfolioStateResponse' } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /v1/hypercore/extra-agents:
    post:
      tags: [Enriched account data]
      operationId: extraAgents
      summary: Get agent and API-wallet state
      description: Proposed purpose-built composite for agent and API-wallet information associated with a user.
      x-alchemy-review-status: engineering-review-required
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserRequest' }
      responses:
        '200':
          description: Proposed agent list.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExtraAgentsResponse' }
              examples: { default: { $ref: '#/components/examples/ExtraAgentsResponse' } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
components:
  securitySchemes:
    alchemyApiKey:
      type: http
      scheme: bearer
      bearerFormat: API key
      description: Proposed placeholder authentication. Confirm the final transport contract before release.
  schemas:
    Address: { type: string, pattern: '^0x[a-fA-F0-9]{40}$', description: EVM-style account address. Case normalization requires review. }
    Cursor: { type: string, description: Opaque pagination cursor. }
    TimestampMs: { type: integer, format: int64, description: Unix timestamp in milliseconds. }
    Pagination:
      type: object
      properties: { nextCursor: { $ref: '#/components/schemas/Cursor' } }
    UserRequest:
      type: object
      required: [user]
      properties:
        user: { $ref: '#/components/schemas/Address' }
        startTime: { $ref: '#/components/schemas/TimestampMs' }
        endTime: { $ref: '#/components/schemas/TimestampMs' }
        cursor: { $ref: '#/components/schemas/Cursor' }
        include: { type: array, items: { type: string } }
    InfoRequest:
      oneOf:
        - $ref: '#/components/schemas/UserFillsRequest'
        - $ref: '#/components/schemas/UserFillsByTimeRequest'
        - $ref: '#/components/schemas/HistoricalOrdersRequest'
        - $ref: '#/components/schemas/UserFundingRequest'
        - $ref: '#/components/schemas/UserLedgerRequest'
        - $ref: '#/components/schemas/DelegationsRequest'
        - $ref: '#/components/schemas/DelegatorHistoryRequest'
        - $ref: '#/components/schemas/ClearinghouseStateRequest'
        - $ref: '#/components/schemas/SpotClearinghouseStateRequest'
        - $ref: '#/components/schemas/FrontendOpenOrdersRequest'
      discriminator: { propertyName: type }
    UserFillsRequest: { allOf: [ { $ref: '#/components/schemas/UserRequest' }, { type: object, required: [type], properties: { type: { const: userFills } } } ] }
    UserFillsByTimeRequest: { allOf: [ { $ref: '#/components/schemas/UserRequest' }, { type: object, required: [type, startTime, endTime], properties: { type: { const: userFillsByTime } } } ] }
    HistoricalOrdersRequest: { allOf: [ { $ref: '#/components/schemas/UserRequest' }, { type: object, required: [type], properties: { type: { const: historicalOrders } } } ] }
    UserFundingRequest: { allOf: [ { $ref: '#/components/schemas/UserRequest' }, { type: object, required: [type], properties: { type: { const: userFunding } } } ] }
    UserLedgerRequest: { allOf: [ { $ref: '#/components/schemas/UserRequest' }, { type: object, required: [type], properties: { type: { const: userNonFundingLedgerUpdates } } } ] }
    DelegationsRequest: { allOf: [ { $ref: '#/components/schemas/UserRequest' }, { type: object, required: [type], properties: { type: { const: delegations } } } ] }
    DelegatorHistoryRequest: { allOf: [ { $ref: '#/components/schemas/UserRequest' }, { type: object, required: [type], properties: { type: { const: delegatorHistory } } } ] }
    ClearinghouseStateRequest: { allOf: [ { $ref: '#/components/schemas/UserRequest' }, { type: object, required: [type], properties: { type: { const: clearinghouseState } } } ] }
    SpotClearinghouseStateRequest: { allOf: [ { $ref: '#/components/schemas/UserRequest' }, { type: object, required: [type], properties: { type: { const: spotClearinghouseState } } } ] }
    FrontendOpenOrdersRequest: { allOf: [ { $ref: '#/components/schemas/UserRequest' }, { type: object, required: [type], properties: { type: { const: frontendOpenOrders } } } ] }
    Fill:
      type: object
      required: [coin, px, sz, side, time, tid]
      properties:
        coin: { type: string }
        px: { type: string, description: String-encoded decimal price. }
        sz: { type: string, description: String-encoded decimal size. }
        side: { type: string, enum: [B, A] }
        time: { $ref: '#/components/schemas/TimestampMs' }
        tid: { type: integer }
        oid: { type: integer }
        fee: { type: string }
    Order:
      type: object
      properties:
        orderId: { type: string }
        coin: { type: string }
        side: { type: string }
        limitPx: { type: string }
        sz: { type: string }
        status: { type: string }
        timestamp: { $ref: '#/components/schemas/TimestampMs' }
    FundingEvent:
      type: object
      properties: { coin: { type: string }, usdc: { type: string }, szi: { type: string }, time: { $ref: '#/components/schemas/TimestampMs' }, fundingRate: { type: string } }
    LedgerEvent:
      type: object
      properties: { time: { $ref: '#/components/schemas/TimestampMs' }, hash: { type: string }, delta: { type: object, additionalProperties: true } }
    Delegation:
      type: object
      properties: { validator: { $ref: '#/components/schemas/Address' }, amount: { type: string }, lockedUntilTimestamp: { $ref: '#/components/schemas/TimestampMs' } }
    ClearinghouseState:
      type: object
      properties: { marginSummary: { type: object, additionalProperties: true }, assetPositions: { type: array, items: { type: object, additionalProperties: true } } }
    SpotClearinghouseState:
      type: object
      properties: { balances: { type: array, items: { type: object, additionalProperties: true } }, openOrders: { type: array, items: { $ref: '#/components/schemas/Order' } } }
    PortfolioState:
      type: object
      properties: { user: { $ref: '#/components/schemas/Address' }, asOf: { $ref: '#/components/schemas/TimestampMs' }, perpetual: { type: object, additionalProperties: true }, spot: { type: object, additionalProperties: true }, margin: { type: object, additionalProperties: true } }
    Agent:
      type: object
      properties: { address: { $ref: '#/components/schemas/Address' }, name: { type: string }, permissions: { type: array, items: { type: string } } }
    ExtraAgentsResponse: { type: object, properties: { user: { $ref: '#/components/schemas/Address' }, agents: { type: array, items: { $ref: '#/components/schemas/Agent' } } } }
    InfoResponse:
      oneOf:
        - type: object
          properties: { fills: { type: array, items: { $ref: '#/components/schemas/Fill' } }, nextCursor: { $ref: '#/components/schemas/Cursor' } }
        - type: object
          properties: { orders: { type: array, items: { $ref: '#/components/schemas/Order' } }, nextCursor: { $ref: '#/components/schemas/Cursor' } }
        - type: object
          properties: { funding: { type: array, items: { $ref: '#/components/schemas/FundingEvent' } }, nextCursor: { $ref: '#/components/schemas/Cursor' } }
        - $ref: '#/components/schemas/ClearinghouseState'
        - $ref: '#/components/schemas/SpotClearinghouseState'
    ErrorResponse:
      type: object
      required: [code, message]
      properties: { code: { type: string }, message: { type: string }, requestId: { type: string } }
  responses:
    BadRequest: { description: Invalid parameters, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
    Unauthorized: { description: Missing or invalid API key, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
    RateLimited: { description: Proposed rate-limit response, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
  examples:
    UserFillsResponse: { value: { fills: [ { coin: BTC, px: '100000.0', sz: '0.01', side: B, time: 1780000000000, tid: 12345, oid: 54321, fee: '0.20' } ] } }
    PortfolioStateResponse: { value: { user: '0x1111111111111111111111111111111111111111', asOf: 1780000000000, perpetual: { accountValue: '1000.00', positions: [] }, spot: { balances: [] }, margin: { totalMarginUsed: '100.00' } } }
    ExtraAgentsResponse: { value: { user: '0x1111111111111111111111111111111111111111', agents: [ { address: '0x4444444444444444444444444444444444444444', name: market-maker, permissions: [trade] } ] } }
security: [ { alchemyApiKey: [] } ]
