openrpc: 1.3.2
info:
  title: Alchemy HyperCore JSON-RPC API - Draft Contract
  version: 0.1.0-draft
  description: Candidate OpenRPC contract for HyperCore block lookup, backfill, and batch reads. No production endpoint is implied.
servers:
  - name: proposed-hypercore-json-rpc
    url: https://<HYPERCORE_HTTP_URL>
methods:
  - name: hl_getLatestBlocks
    summary: Get latest blocks
    description: No proposed cap; use a small bounded limit. Results retain request order; valid missing identifiers are returned explicitly.
    tags: [{ name: HyperCore block and batch }]
    x-alchemy-review-status: engineering-review-required
    params:
      - name: limit
        required: true
        schema: { type: integer, format: int64 }
    result:
      name: result
      schema: { type: object, additionalProperties: true }
    examples:
      - name: illustrative
        params: [ { name: limit, value: 10 } ]
        result: { name: result, value: { blocks: [{ blockHeight: 123456, blockTime: 1780000000000, isFinal: true }], nextCursor: optional-cursor } }
  - name: hl_getBlock
    summary: Get a block
    description: Not found uses proposed error code -32004. Results retain request order; valid missing identifiers are returned explicitly.
    tags: [{ name: HyperCore block and batch }]
    x-alchemy-review-status: engineering-review-required
    params:
      - name: blockHeight
        required: true
        schema: { type: integer, format: int64 }
    result:
      name: result
      schema: { type: object, additionalProperties: true }
    examples:
      - name: illustrative
        params: [ { name: blockHeight, value: 123456 } ]
        result: { name: result, value: { block: { metadata: { blockHeight: 123456, blockTime: 1780000000000, isFinal: true }, commands: [], actions: [], events: [], fills: [] } } }
  - name: hl_getBatchBlocks
    summary: Get multiple blocks
    description: Proposed maximum 200 block heights. Results retain request order; valid missing identifiers are returned explicitly.
    tags: [{ name: HyperCore block and batch }]
    x-alchemy-review-status: engineering-review-required
    params:
      - name: blockHeights
        required: true
        schema: { type: array, items: { type: integer, format: int64 } }
    result:
      name: result
      schema: { type: object, additionalProperties: true }
    examples:
      - name: illustrative
        params: [ { name: blockHeights, value: [123456, 123457] } ]
        result: { name: result, value: { blocks: [], missingBlockHeights: [] } }
  - name: hl_batchClearinghouseStates
    summary: Get multiple clearinghouse states
    description: Proposed maximum 1000 users. Results retain request order; valid missing identifiers are returned explicitly.
    tags: [{ name: HyperCore block and batch }]
    x-alchemy-review-status: engineering-review-required
    params:
      - name: users
        required: true
        schema: { type: array, items: { type: string } }
    result:
      name: result
      schema: { type: object, additionalProperties: true }
    examples:
      - name: illustrative
        params: [ { name: users, value: ['0x1111111111111111111111111111111111111111'] } ]
        result: { name: result, value: { states: [], missingUsers: [] } }
  - name: hl_batchPortfolioStates
    summary: Get multiple portfolio states
    description: Proposed maximum 500 users. Results retain request order; valid missing identifiers are returned explicitly.
    tags: [{ name: HyperCore block and batch }]
    x-alchemy-review-status: engineering-review-required
    params:
      - name: users
        required: true
        schema: { type: array, items: { type: string } }
    result:
      name: result
      schema: { type: object, additionalProperties: true }
    examples:
      - name: illustrative
        params: [ { name: users, value: ['0x1111111111111111111111111111111111111111'] } ]
        result: { name: result, value: { states: [], missingUsers: [] } }
  - name: hl_batchOpenOrders
    summary: Get multiple open-order sets
    description: Proposed maximum 100 users. Results retain request order; valid missing identifiers are returned explicitly.
    tags: [{ name: HyperCore block and batch }]
    x-alchemy-review-status: engineering-review-required
    params:
      - name: users
        required: true
        schema: { type: array, items: { type: string } }
    result:
      name: result
      schema: { type: object, additionalProperties: true }
    examples:
      - name: illustrative
        params: [ { name: users, value: ['0x1111111111111111111111111111111111111111'] } ]
        result: { name: result, value: { ordersByUser: [], missingUsers: [] } }
components:
  schemas:
    Address: { type: string, pattern: '^0x[a-fA-F0-9]{40}$' }
    BlockIdentifier: { type: integer, format: int64, description: 'HyperCore block height, not an EVM block number.' }
    BlockMetadata: { type: object, properties: { blockHeight: { type: integer }, blockTime: { type: integer, format: int64, description: 'Unix milliseconds.' }, isFinal: { type: boolean } } }
    HyperCoreBlock: { type: object, properties: { metadata: { $ref: '#/components/schemas/BlockMetadata' }, commands: { type: array, items: { type: object } }, actions: { type: array, items: { $ref: '#/components/schemas/BlockAction' } }, events: { type: array, items: { $ref: '#/components/schemas/BlockEvent' } }, fills: { type: array, items: { $ref: '#/components/schemas/Fill' } } } }
    BlockAction: { type: object, additionalProperties: true, description: Proposed raw HyperCore action representation. }
    BlockEvent: { type: object, additionalProperties: true, description: Proposed normalized HyperCore event representation. }
    Fill: { type: object, properties: { coin: { type: string }, px: { type: string }, sz: { type: string }, side: { type: string }, time: { type: integer, format: int64 } } }
    ClearinghouseState: { type: object, additionalProperties: true }
    PortfolioState: { type: object, additionalProperties: true }
    OpenOrder: { type: object, additionalProperties: true }
    ErrorObject: { type: object, required: [code, message], properties: { code: { type: integer }, message: { type: string }, data: { type: object } } }
  errors:
    - code: -32600
      message: Invalid Request
      data: { reviewStatus: engineering-review-required }
    - code: -32601
      message: Method not found
    - code: -32602
      message: Invalid params
    - code: -32004
      message: Resource not found
    - code: -32009
      message: Cursor unavailable
    - code: -32029
      message: Rate limited
